<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ODI 관리자 포털 — 준비중</title>
<style>
:root{--bg:#0d1117;--sf:#161b22;--sf2:#21262d;--bd:rgba(255,255,255,.08);--tp:#e6edf3;--ts:#8b949e;--rd:#f85149;--rdd:rgba(248,81,73,.13);font-family:system-ui,'Noto Sans KR',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tp);min-height:100vh;display:flex;flex-direction:column;font-size:13px}.top{height:48px;border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 16px;gap:8px;background:#0d0505}.logo{font-weight:800}.nav{margin-left:auto;display:flex;gap:6px}.btn{display:inline-flex;align-items:center;border:1px solid var(--bd);background:var(--sf2);color:var(--ts);border-radius:6px;padding:6px 11px;text-decoration:none;font-size:12px}.btn.active{background:var(--rdd);color:var(--rd);border-color:rgba(248,81,73,.35)}main{flex:1;display:flex;align-items:center;justify-content:center;padding:28px}.card{max-width:680px;background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:24px;box-shadow:0 12px 32px rgba(0,0,0,.28)}h1{font-size:20px;margin:0 0 8px}.sub{color:var(--ts);line-height:1.8}.code{margin-top:14px;background:var(--sf2);border:1px solid var(--bd);border-radius:8px;padding:12px;color:var(--ts);font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap}</style>
</head>
<body>
<header class="top"><div class="logo">ODI 관리자 포털</div><nav class="nav"><a class="btn" href="../index.html">👤 사용자 포털</a><span class="btn active">🔐 관리자 포털</span></nav></header>
<main><section class="card"><h1>관리자 포털 준비중</h1><div class="sub">이 파일은 사용자 포털 배포 구조에서 관리자 전환 버튼이 404로 빠지지 않도록 둔 임시 자리표시자입니다. 실제 관리자 콘솔 개발이 완료되면 이 파일만 <b>admin/index.html</b>로 교체하면 됩니다.</div><div class="code">교체 대상: /admin/index.html
사용자 포털: /index.html
공통 원칙: 통합 홈/통합 런처 없음</div></section></main>
</body>
</html>
